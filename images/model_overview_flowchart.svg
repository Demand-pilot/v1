<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .box { fill: #faf8f5; stroke: #e2d9cd; stroke-width: 2.5; rx: 8px; }
      .box-accent { fill: #eee8df; stroke: #d8cbb9; stroke-width: 2.5; rx: 8px; }
      .box-terracotta { fill: #c45d3e; stroke: #a84b30; stroke-width: 2.5; rx: 8px; }
      .title-head { font-family: 'Playfair Display', Georgia, serif; font-weight: 700; fill: #2d2a26; font-size: 20px; }
      .label-header { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; fill: #c45d3e; text-transform: uppercase; letter-spacing: 1.2px; }
      .label-white { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 14px; font-weight: 700; fill: #ffffff; }
      .text-main { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 13.5px; font-weight: 600; fill: #2d2a26; }
      .text-sub { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 12px; fill: #635e58; }
      .arrow-line { stroke: #c45d3e; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .arrow-head { fill: #c45d3e; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head" />
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg" rx="10"/>

  <!-- Top Banner Title -->
  <text x="460" y="32" text-anchor="middle" class="title-head">DemandPilot Model Overview Pipeline</text>

  <!-- Step 1: User & Dashboard -->
  <rect x="20" y="48" width="420" height="65" class="box"/>
  <text x="230" y="73" text-anchor="middle" class="label-header">1. USER / DASHBOARD INTERFACE</text>
  <text x="230" y="96" text-anchor="middle" class="text-main">Next.js 14 App Router • Three.js 3D Store Map</text>

  <!-- Arrow Horizontal 1->2 -->
  <line x1="440" y1="80" x2="470" y2="80" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Step 2: API & AI Agent -->
  <rect x="480" y="48" width="420" height="65" class="box-accent"/>
  <text x="690" y="73" text-anchor="middle" class="label-header">2. FASTAPI ORCHESTRATOR &amp; AI AGENT</text>
  <text x="690" y="96" text-anchor="middle" class="text-main">Grounded LLM RAG • Zero Hallucination Gate</text>

  <!-- Arrow Down to Step 3 -->
  <line x1="690" y1="113" x2="690" y2="138" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Step 3: Demand Profiler & Data Quality -->
  <rect x="480" y="140" width="420" height="75" class="box"/>
  <text x="690" y="165" text-anchor="middle" class="label-header">3. DEMAND INTELLIGENCE PROFILER</text>
  <text x="690" y="188" text-anchor="middle" class="text-main">Volatility CV • Zero Ratio (53 Bypass Mask)</text>
  <text x="690" y="206" text-anchor="middle" class="text-sub">Sparsity Router &amp; Promo Elasticity</text>

  <!-- Arrow Left Step 3->4 -->
  <line x1="480" y1="177" x2="450" y2="177" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Step 4: Feature Engineering -->
  <rect x="20" y="140" width="420" height="75" class="box-accent"/>
  <text x="230" y="165" text-anchor="middle" class="label-header">4. FEATURE ENGINEERING MATRIX</text>
  <text x="230" y="188" text-anchor="middle" class="text-main">Payday 16th/1st Lags • Promo Rolling Leads</text>
  <text x="230" y="206" text-anchor="middle" class="text-sub">Delta Oil Differencing • Store Type Context</text>

  <!-- Arrow Down Step 4->5 -->
  <line x1="230" y1="215" x2="230" y2="240" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Step 5: Model Candidates Bar Header -->
  <rect x="20" y="242" width="880" height="35" class="box-accent"/>
  <text x="460" y="265" text-anchor="middle" class="label-header">5. PARALLEL MODEL CANDIDATE ENGINES</text>

  <!-- 3 Model Engine Boxes -->
  <!-- Model A: PyTorch LSTM -->
  <rect x="20" y="287" width="280" height="85" class="box"/>
  <text x="160" y="313" text-anchor="middle" class="label-header">PyTorch LSTM</text>
  <text x="160" y="337" text-anchor="middle" class="text-main">60-Day Lookback Window</text>
  <text x="160" y="356" text-anchor="middle" class="text-sub">High-Volume Smooth Staples</text>

  <!-- Model B: LightGBM / XGBoost GBDT -->
  <rect x="320" y="287" width="280" height="85" class="box-terracotta"/>
  <text x="460" y="313" text-anchor="middle" class="label-white">LightGBM / XGBoost GBDT</text>
  <text x="460" y="337" text-anchor="middle" class="label-white" font-size="13px">Tabular Promo Multipliers</text>
  <text x="460" y="356" text-anchor="middle" class="label-white" font-size="11.5px">Sierra School Season (+145% Surge)</text>

  <!-- Model C: Baseline Rules -->
  <rect x="620" y="287" width="280" height="85" class="box"/>
  <text x="760" y="313" text-anchor="middle" class="label-header">Seasonal Baselines</text>
  <text x="760" y="337" text-anchor="middle" class="text-main">Moving Average / Croston</text>
  <text x="760" y="356" text-anchor="middle" class="text-sub">Intermittent &amp; Sparse Series</text>

  <!-- Arrows Down to Step 6 -->
  <line x1="160" y1="372" x2="460" y2="400" class="arrow-line" marker-end="url(#arrow)"/>
  <line x1="460" y1="372" x2="460" y2="400" class="arrow-line" marker-end="url(#arrow)"/>
  <line x1="760" y1="372" x2="460" y2="400" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Step 6: Rolling Backtest Engine -->
  <rect x="150" y="402" width="620" height="55" class="box-accent"/>
  <text x="460" y="425" text-anchor="middle" class="label-header">6. HISTORICAL ROLLING 16-DAY BACKTEST</text>
  <text x="460" y="446" text-anchor="middle" class="text-main">Evaluates RMSLE Prediction Error across 1,782 Series</text>

  <!-- Arrow Down Step 6->7 -->
  <line x1="460" y1="457" x2="460" y2="480" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Step 7: Mediator Routing -->
  <rect x="20" y="482" width="420" height="70" class="box"/>
  <text x="230" y="507" text-anchor="middle" class="label-header">7. MEDIATOR ROUTING</text>
  <text x="230" y="530" text-anchor="middle" class="text-main">Single Selector vs. Soft-Max Ensemble</text>

  <!-- Arrow Right Step 7->8 -->
  <line x1="440" y1="517" x2="470" y2="517" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- Step 8: Final Forecast & Inventory Recommendation -->
  <rect x="480" y="482" width="420" height="70" class="box-terracotta"/>
  <text x="690" y="507" text-anchor="middle" class="label-white">8. 16-DAY FORECAST &amp; INVENTORY ROP</text>
  <text x="690" y="530" text-anchor="middle" class="label-white" font-size="12.5px">Reorder Point &amp; Safety Stock Webhooks → AI Explanation</text>

  <!-- Bottom Caption -->
  <text x="460" y="595" text-anchor="middle" class="text-sub" font-size="12px">DemandPilot Execution Workflow: Profiling → Multi-Model Selection → Backtest Routing → Replenishment</text>
</svg>
