# Minimal dataset: required columns only.
#
# No promo, no price, no exogenous series, no calendar flags, no event decays, no
# closures, no entity metadata. This is the floor the pipeline must handle, and it is the
# GATE 2 fixture: if training and forecasting need anything beyond entity/item/date/target,
# the system is not dataset-agnostic.
#
# The CSV is generated by tests/test_adapter_generalization.py.

name: synthetic_minimal
grain: daily

files:
  main:
    path: data/synthetic_minimal.csv
    entity_id: location
    item_id: sku
    date: day
    target: units

promo_known_in_advance: false

permanent_zero_min_history: 200
